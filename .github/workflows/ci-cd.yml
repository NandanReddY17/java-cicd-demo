# End-to-end CI/CD: GitHub -> Maven -> Docker -> Amazon ECR -> Amazon EKS
# Runs automatically on every push to main. Pull requests only build and test.
name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}          # "Run workflow" button for manual re-runs

concurrency:                      # never run two deployments at once
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: java-cicd-cluster
  ECR_REPOSITORY: java-cicd-demo

permissions:
  contents: read

jobs:
  # ---------- Stage 1-3: checkout, compile/package, test ----------
  build-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Run unit tests
        run: mvn -B test

      - name: Package JAR
        run: mvn -B -DskipTests package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload JAR for the Docker stage
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/java-cicd-demo.jar
          retention-days: 1

  # ---------- Stage 4-5: build, tag and push the image ----------
  docker:
    name: Docker Build & Push (ECR)
    needs: build-test
    # Runs only on pushes, and only after AWS is connected
    # (repo Settings > Secrets and variables > Actions > Variables: AWS_DEPLOY = true).
    if: github.event_name != 'pull_request' && vars.AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag (Git commit SHA)
        id: meta
        run: |
          SHA="${GITHUB_SHA::7}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:$SHA" >> "$GITHUB_OUTPUT"

      - name: Build and tag Docker image
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image }}" \
            -t "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:latest" .

      - name: Push image to ECR
        run: |
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:latest"

  # ---------- Stage 6-7: deploy to EKS with Ansible and verify ----------
  deploy:
    name: Deploy to EKS & Verify
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect kubectl to EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Install Ansible
        run: command -v ansible-playbook || pipx install ansible-core

      - name: Deploy and verify with Ansible
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            -e image="${{ needs.docker.outputs.image }}" \
            -e build="${{ needs.docker.outputs.sha }}"
