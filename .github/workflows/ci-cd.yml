# End-to-end CI/CD: GitHub -> Maven -> Docker -> GitHub Container Registry -> Azure Kubernetes Service
# Runs automatically on every push to main. Pull requests only build and test.
name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}          # "Run workflow" button for manual re-runs

concurrency:                      # never run two deployments at once
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: java-cicd-demo

permissions:
  contents: read

jobs:
  # ---------- Stage 0: secret scanning (quality/security gate) ----------
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0              # scan every commit, not just the latest snapshot

      - name: Scan for committed secrets
        # Fails the pipeline (exit code 1) if a password, API key, token or private key
        # is found anywhere in the history. --redact hides the secret value in the log.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --verbose

  # ---------- Stage 1-3: checkout, compile/package, test ----------
  build-test:
    name: Build & Test (Maven)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Run unit tests
        run: mvn -B test

      - name: Package JAR
        run: mvn -B -DskipTests package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload JAR for the Docker stage
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/java-cicd-demo.jar
          retention-days: 1

  # ---------- Stage 4-5: build, tag and push the image ----------
  docker:
    name: Docker Build & Push (GHCR)
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write             # lets the built-in GITHUB_TOKEN push to ghcr.io
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag (Git commit SHA)
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"          # registry names must be lowercase
          SHA="${GITHUB_SHA::7}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "repo=$REGISTRY/$OWNER/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$OWNER/$IMAGE_NAME:$SHA" >> "$GITHUB_OUTPUT"

      - name: Build and tag Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "${{ steps.meta.outputs.image }}" \
            -t "${{ steps.meta.outputs.repo }}:latest" .

      - name: Push image to GHCR
        run: |
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.repo }}:latest"

  # ---------- Stage 6-7: deploy to AKS with Ansible and verify ----------
  deploy:
    name: Deploy to AKS & Verify
    needs: docker
    # Runs only after the cluster is connected
    # (repo Settings > Secrets and variables > Actions > Variables: CLOUD_DEPLOY = true).
    if: vars.CLOUD_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Connect kubectl to AKS
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_CONTENT" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version
          kubectl get deployments

      - name: Install Ansible
        run: command -v ansible-playbook || pipx install ansible-core

      - name: Deploy and verify with Ansible
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            -e image="${{ needs.docker.outputs.image }}" \
            -e build="${{ needs.docker.outputs.sha }}"
